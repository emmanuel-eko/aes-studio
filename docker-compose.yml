services:
  backend:
    build: ./backend
    environment:
      AES_STUDIO_HOST: 0.0.0.0
      AES_STUDIO_PORT: 48180
      AES_STUDIO_CORS_ORIGINS: http://127.0.0.1:43123,http://localhost:43123
      AES_STUDIO_MAX_MESSAGE_BYTES: 256
    ports:
      - "48180:48180"

  frontend:
    build: ./frontend
    ports:
      - "43123:80"
    depends_on:
      - backend
